# Configuracion de cluster de RabbitMQ (se monta como /etc/rabbitmq/conf.d/20-cluster.conf).

# Los nodos se descubren por una lista fija de nombres (suficiente para 2 nodos en Docker Compose)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Permite que el usuario guest se conecte desde fuera del contenedor (solo para laboratorio)
loopback_users.guest = false
