# Cluster RabbitMQ de 2 nodos (rabbit1 y rabbit2) para la Tienda de Perritos.
#
# Que levanta:
#   rabbit1          nodo 1. AMQP localhost:5672, panel web http://localhost:15672
#   rabbit2          nodo 2. AMQP localhost:5673, panel web http://localhost:15673 (se une solo al cluster)
#   rabbitmq-setup   contenedor que corre una vez: espera que los 2 nodos esten unidos y carga las colas,
#                    exchanges y bindings de definitions.json por la API HTTP. Despues termina (es normal que
#                    aparezca como "Exited (0)").
#
# Levantar:   docker compose up -d        (desde esta carpeta)
# Ver logs de la carga:  docker compose logs rabbitmq-setup
# Detener:    docker compose down         (agrega -v para borrar tambien los datos)
#
# Usuario y clave de laboratorio: guest / guest (los mismos que usan Ventas, Despachos y RabbitAdmin).
# No lo levantes junto con el DOCKER-COMPOSE.YML de la raiz (un solo nodo): usan los mismos puertos.
#
# Como se forma el cluster: ambos nodos comparten la cookie de Erlang (RABBITMQ_ERLANG_COOKIE), que es la
# "contrasena" que permite a los nodos hablar entre si, y rabbitmq.conf les indica quienes son sus pares.
# rabbit2 espera a que rabbit1 este sano y se une a el al arrancar.

name: rabbitmq-cluster

services:
  rabbit1:
    image: rabbitmq:4.2-management
    hostname: rabbit1
    container_name: rabbit1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: tienda-perritos-cookie-de-laboratorio
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit1-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - rabbit-net

  rabbit2:
    image: rabbitmq:4.2-management
    hostname: rabbit2
    container_name: rabbit2
    restart: unless-stopped
    depends_on:
      rabbit1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: tienda-perritos-cookie-de-laboratorio
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit2-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - rabbit-net

  rabbitmq-setup:
    image: curlimages/curl:8.10.1
    container_name: rabbitmq-setup
    restart: "no"
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
    volumes:
      - ./definitions.json:/definitions.json:ro
      - ./setup.sh:/setup.sh:ro
    # "tr -d" elimina los retornos de carro de Windows (CRLF) por si Git cambio los saltos de linea del script
    entrypoint: ["sh", "-c", "tr -d '\\r' < /setup.sh | sh"]
    networks:
      - rabbit-net

networks:
  rabbit-net:

volumes:
  rabbit1-data:
  rabbit2-data:
