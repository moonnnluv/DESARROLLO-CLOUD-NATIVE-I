# Cluster Kafka de la Tienda de Perritos: 3 Zookeeper + 3 brokers.
#
#   Zookeeper (3 nodos)  forman un "ensemble": eligen un lider por votacion y siguen funcionando
#                        mientras haya mayoria (2 de 3). Guardan la metadata del cluster (brokers vivos,
#                        topicos, quien es lider de cada particion).
#   Brokers (3)          almacenan los mensajes. Cada particion de un topico tiene 3 copias, una en cada
#                        broker: 1 lider (atiende lecturas y escrituras) y 2 seguidores que lo replican.
#
# Levantar:   docker compose up -d        (desde esta carpeta)
# Estado:     docker compose ps           (los brokers pasan a "healthy" en ~1 minuto)
# Detener:    docker compose down         (agrega -v para borrar tambien los datos)
#
# Despues levanta Kafka UI con ../kafka-ui/docker-compose.yml (usa la red "kafka-net" que crea este archivo).
#
# Puertos para las aplicaciones en tu PC:  kafka-1 -> localhost:9092, kafka-2 -> localhost:9093, kafka-3 -> localhost:9094
# Direccion entre contenedores (Kafka UI):  kafka-1:29092, kafka-2:29092, kafka-3:29092
#
# No levantes este compose junto con kafka-lab/compose.yaml (nodo unico): ambos usan el puerto 9092.

name: kafka-cluster

services:

  # ------------------------------------------------------------------ Zookeeper
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper-1
    container_name: zookeeper-1
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      # Permite consultar el rol de cada nodo (leader o follower) con el comando "srvr"
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log
    networks:
      - kafka-net

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper-2
    container_name: zookeeper-2
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      # Permite consultar el rol de cada nodo (leader o follower) con el comando "srvr"
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-log:/var/lib/zookeeper/log
    networks:
      - kafka-net

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper-3
    container_name: zookeeper-3
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      # Permite consultar el rol de cada nodo (leader o follower) con el comando "srvr"
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-log:/var/lib/zookeeper/log
    networks:
      - kafka-net

  # -------------------------------------------------------------------- Brokers
  # Cada broker expone dos listeners:
  #   INTERNAL (29092): comunicacion entre brokers y con otros contenedores (Kafka UI)
  #   EXTERNAL (909x):  para las aplicaciones Spring que corren en tu PC (publica el puerto al host)
  #
  # Parametros comunes y por que se eligieron:
  #   DEFAULT_REPLICATION_FACTOR=3        un topico creado sin indicar replicas se guarda en los 3 brokers
  #   NUM_PARTITIONS=3                    y con 3 particiones (se puede repartir la carga entre 3 consumidores)
  #   AUTO_CREATE_TOPICS_ENABLE=false     los topicos se crean a proposito (Streaming o KafkaAdmin), no por un error de tipeo
  #   OFFSETS_TOPIC_REPLICATION_FACTOR=3  los offsets de los consumer groups tambien sobreviven a la caida de un broker
  #   ZOOKEEPER_CONNECTION_TIMEOUT_MS     espera hasta 60 s a que el ensemble de Zookeeper este listo al arrancar todo junto
  #
  # min.insync.replicas=2 se define en cada topico del proyecto (no a nivel de broker): con acks=all un mensaje
  # se confirma cuando 2 copias lo tienen, asi se puede perder 1 broker sin perder datos y sin dejar de escribir.
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    container_name: kafka-1
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-2
    container_name: kafka-2
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-3
    container_name: kafka-3
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-3:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - kafka-net

# Red con nombre fijo para que el compose de Kafka UI pueda unirse a ella como red externa.
networks:
  kafka-net:
    name: kafka-net

volumes:
  zookeeper-1-data:
  zookeeper-1-log:
  zookeeper-2-data:
  zookeeper-2-log:
  zookeeper-3-data:
  zookeeper-3-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
