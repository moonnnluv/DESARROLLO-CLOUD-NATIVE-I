spring.application.name=kafka-admin
server.port=8085

springdoc.swagger-ui.path=/swagger-ui.html

# --- Kafka: los 3 brokers del cluster (docker/kafka). Con uno solo disponible basta para conectarse ---
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
# Tiempos cortos para que la API responda 502 rapido si el cluster esta caido, en vez de colgarse
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=10000

# --- Seguridad: JWT emitido por Microsoft Entra ID (igual que Ventas, Despachos y RabbitAdmin) ---
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=197fe94c-f4bc-47b0-adc7-c88d43c9e018
spring.cloud.azure.active-directory.app-id-uri=api://197fe94c-f4bc-47b0-adc7-c88d43c9e018
