spring.application.name=Springboot-API-REST
server.port=8081

# Base de datos H2 en memoria (temporal, mientras no hay acceso al RDS de AWS).
# Se recrea vacia cada vez que arranca la aplicacion.
spring.datasource.url=jdbc:h2:mem:ventasdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuraci�n de Hibernate
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.path=/swagger-ui.html

# --- Seguridad: validacion de JWT emitido por Microsoft Entra ID (IDaaS) ---
# Siguiendo la guia oficial "Configurar Spring Security en el Backend con Microsoft Entra ID y JWT"
# AZURE_CLIENT_ID y AZURE_APP_ID_URI no son secretos (son identificadores publicos
# entregados por Azure), por eso van escritos directo aqui, a diferencia de la password de la BD.
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=197fe94c-f4bc-47b0-adc7-c88d43c9e018
spring.cloud.azure.active-directory.app-id-uri=api://197fe94c-f4bc-47b0-adc7-c88d43c9e018


#RabbitMQ 

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

#RabbitMQ Retry 

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-interval=30000
spring.rabbitmq.template.retry.multiplier=2.0